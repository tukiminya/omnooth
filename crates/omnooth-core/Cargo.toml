[package]
name = "omnooth-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
bzip2 = "0.6.1"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.9"
fs2 = "0.4.3"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls"] }
rusqlite = { version = "0.38.0", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sevenz-rust2 = "0.25.0"
sha2 = "0.10.9"
tar = "0.4.46"
thiserror = "2.0.20"
unrar_sys = "0.5.8"
url = "2.5.8"
uuid = { version = "1.24.1", features = ["v4"] }
xz2 = "0.1.7"
zip = { version = "8.6.0", default-features = false, features = ["aes-crypto", "deflate"] }
